name: Synthetic demo tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run public standalone unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic data and provenance
        run: |
          python scripts/make_synthetic_fixture.py --out data/synthetic_demo_fixture.sqlite
          python -m v3sim.dynamic_cli --config config_demo_synthetic.json --atlas data/synthetic_demo_fixture.sqlite --out output/demo --trace-limit 3
          python scripts/analyze_demo.py --input output/demo/empresas_resultados.csv --out output/demo/category_summary.csv
      - name: Run sensitivity analysis
        run: |
          python -m v3sim.dynamic_analysis --config config_demo_synthetic.json --atlas data/synthetic_demo_fixture.sqlite --out output/sensitivity --scales 0.8 1.0 1.3 1.7 --seeds 20261012 20261013 20261014 20261015

  visualizations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional plotting dependencies
        run: python -m pip install 'pandas>=2.0,<3.0' 'matplotlib>=3.7,<4.0'
      - name: Generate synthetic demo and sensitivity plots
        run: |
          python scripts/make_synthetic_fixture.py --out data/synthetic_demo_fixture.sqlite
          python -m v3sim.dynamic_cli --config config_demo_synthetic.json --atlas data/synthetic_demo_fixture.sqlite --out output/demo --trace-limit 0
          python -m v3sim.dynamic_analysis --config config_demo_synthetic.json --atlas data/synthetic_demo_fixture.sqlite --out output/sensitivity --scales 0.8 1.0 1.3 1.7 --seeds 20261012 20261013 20261014 20261015
          python scripts/plot_results.py --companies output/demo/empresas_resultados.csv --sensitivity output/sensitivity/barrido_v32.csv --out output/figures
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-analysis-figures
          path: output/figures/
